name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract and Organize Project
      run: |
        unzip -o *.zip
        ROOT_FILE=$(find . -mindepth 2 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
        if [ -n "$ROOT_FILE" ]; then
          DIR=$(dirname "$ROOT_FILE")
          shopt -s dotglob
          mv "$DIR"/* . 2>/dev/null || true
        fi
        
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # إعدادات JVM وKSP
        mkdir -p ~/.gradle
        cat << 'EOF' > ~/.gradle/gradle.properties
        org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED
        ksp.incremental=false
        ksp.incremental.intermodule=false
        org.gradle.parallel=false
        EOF

        cp ~/.gradle/gradle.properties ./gradle.properties
        
        # إنشاء مفتاح debug.keystore تلقائياً
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # إنشاء ملف google-services.json لتفادي خطأ خدمات جوجل
        DUMMY_JSON='{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}]}]}'
        echo "$DUMMY_JSON" > google-services.json
        mkdir -p app && echo "$DUMMY_JSON" > app/google-services.json

        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      env:
        GRADLE_OPTS: "-Djava.awt.headless=true"
      run: ./gradlew assembleDebug --no-daemon --no-parallel

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
