name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract and setup project
      run: |
        unzip -o *.zip
        # في حال وجود الكود داخل مجلد فرعي يتم رفعه للمسار الرئيسي
        if [ ! -f "gradlew" ]; then
          DIR=$(find . -mindepth 2 -maxdepth 2 -name "gradlew" -exec dirname {} \;)
          if [ -n "$DIR" ]; then
            cp -r $DIR/* .
          fi
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
