name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract and Organize Project
      run: |
        unzip -o *.zip
        ROOT_FILE=$(find . -mindepth 2 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
        if [ -n "$ROOT_FILE" ]; then
          DIR=$(dirname "$ROOT_FILE")
          shopt -s dotglob
          mv "$DIR"/* . 2>/dev/null || true
        fi
        
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # تطبيق إعدادات KSP الحازمة على مستوى النظام العالمي والمشروع
        mkdir -p ~/.gradle
        cat << 'EOF' > ~/.gradle/gradle.properties
        org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED
        ksp.incremental=false
        ksp.incremental.intermodule=false
        org.gradle.parallel=false
        EOF

        cp ~/.gradle/gradle.properties ./gradle.properties
        
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      env:
        GRADLE_OPTS: "-Djava.awt.headless=true"
      run: ./gradlew assembleDebug --no-daemon --no-parallel

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
