name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract and setup project
      run: |
        unzip -o *.zip
        # البحث عن مكان ملف gradlew ونقله للمجلد الرئيسي للمشروع
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          if [ "$PROJECT_DIR" != "." ]; then
            cp -r "$PROJECT_DIR"/* .
          fi
        else
          echo "Error: gradlew not found!"
          exit 1
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
