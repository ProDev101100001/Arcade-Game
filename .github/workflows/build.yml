name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract and Organize Project
      run: |
        unzip -o *.zip
        # البحث عن المجلد الفعلي ونقل كافة محتوياته للمسار الرئيسي
        ROOT_FILE=$(find . -mindepth 2 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
        if [ -n "$ROOT_FILE" ]; then
          DIR=$(dirname "$ROOT_FILE")
          shopt -s dotglob
          mv "$DIR"/* . 2>/dev/null || true
        fi
        # إنشاء ملف الإقلاع للـ Gradle في حال عدم وجوده
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/outputs/apk/debug/*.apk"
